name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

concurrency:
  group: ghcr-release-latest
  cancel-in-progress: false

jobs:
  validate-tag:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.value }}
      display_name: ${{ steps.version.outputs.display_name }}
    steps:
      - uses: actions/checkout@v7
      - id: version
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          printf '%s\n' "$VERSION" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$'
          display="$(printf '%s\n' "$VERSION" | sed -E 's/^v([0-9]+\.[0-9]+\.[0-9]+)-alpha\.[0-9]+$/alpha-v\1/')"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "display_name=$display" >> "$GITHUB_OUTPUT"
      - name: Require current main commit
        run: |
          git fetch origin main:refs/remotes/origin/main --depth=1
          test "$GITHUB_SHA" = "$(git rev-parse origin/main)"
      - name: Require new release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release already exists: $GITHUB_REF_NAME" >&2
            exit 1
          fi

  tests:
    needs: validate-tag
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate-tag, tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: images
        run: |
          repository="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          {
            echo "app=ghcr.io/$repository-app"
            echo "frontend=ghcr.io/$repository-frontend"
            echo "mongo_init=ghcr.io/$repository-mongo-init"
            echo "meilisearch=ghcr.io/$repository-meilisearch"
            echo "minio=ghcr.io/$repository-minio"
          } >> "$GITHUB_OUTPUT"
      - id: app
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend.Dockerfile
          target: runtime
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.app }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,mode=max,scope=app
      - id: frontend
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.frontend }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - id: mongo_init
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/mongo-init.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.mongo_init }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
          cache-from: type=gha,scope=mongo-init
          cache-to: type=gha,mode=max,scope=mongo-init
      - id: meilisearch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/meilisearch.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.meilisearch }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
          cache-from: type=gha,scope=meilisearch
          cache-to: type=gha,mode=max,scope=meilisearch
      - id: minio
        uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/minio.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.minio }}:${{ needs.validate-tag.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.validate-tag.outputs.version }}
          cache-from: type=gha,scope=minio
          cache-to: type=gha,mode=max,scope=minio
      - name: Package deployment bundle
        env:
          CASE_LIBRARY_APP_IMAGE: ${{ steps.images.outputs.app }}:${{ needs.validate-tag.outputs.version }}
          CASE_LIBRARY_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}:${{ needs.validate-tag.outputs.version }}
          CASE_LIBRARY_MONGO_INIT_IMAGE: ${{ steps.images.outputs.mongo_init }}:${{ needs.validate-tag.outputs.version }}
          CASE_LIBRARY_MEILISEARCH_IMAGE: ${{ steps.images.outputs.meilisearch }}:${{ needs.validate-tag.outputs.version }}
          CASE_LIBRARY_MINIO_IMAGE: ${{ steps.images.outputs.minio }}:${{ needs.validate-tag.outputs.version }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
        run: scripts/package-release.sh "$VERSION" "$RUNNER_TEMP/release"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-tag.outputs.version }}
          DISPLAY_NAME: ${{ needs.validate-tag.outputs.display_name }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: |
          gh release create "$VERSION" "$RELEASE_DIR"/* --latest \
            --title "$DISPLAY_NAME" \
            --notes "Run ./update.sh to install or update this release."
