name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_call:

permissions:
  contents: read

jobs:
  config:
    name: Config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run config stage
        run: make config

  backend-test:
    name: Backend test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run backend test stage
        run: make test-backend

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run frontend test stage
        run: make test-frontend

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-artifacts
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run E2E stage
        run: make e2e
      - name: Upload failed E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14
          if-no-files-found: warn
