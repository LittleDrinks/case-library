name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_call:

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:deploy/ci-build-cache.compose.yml

jobs:
  config:
    name: Config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run config stage
        run: make config

  backend-test:
    name: Backend test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run backend test stage
        run: make test-backend

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run frontend test stage
        run: make test-frontend

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Cache probe (temp)
        run: |
          echo "ACTIONS_RUNTIME_TOKEN: ${ACTIONS_RUNTIME_TOKEN:+set}"
          echo "ACTIONS_CACHE_URL: ${ACTIONS_CACHE_URL:+set}"
          echo "ACTIONS_RESULTS_URL: ${ACTIONS_RESULTS_URL:+set}"
          mkdir -p /tmp/gha-probe && cd /tmp/gha-probe
          printf 'FROM alpine:3.20\nRUN echo hi > /x\n' > Dockerfile
          docker buildx build --cache-to type=gha,mode=max --cache-from type=gha -t gha-probe:1 . 2>&1 | grep -iE 'cache|gha|error' || echo 'no cache lines'
          docker compose version
          cd - >/dev/null
          COMPOSE_FILE=docker-compose.yml:deploy/ci-build-cache.compose.yml docker compose --env-file .env.example --profile test build --dry-run backend-test 2>&1 | head -5
      - name: Run E2E stage
        run: make e2e
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-artifacts
      - name: Upload failed E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14
          if-no-files-found: warn
