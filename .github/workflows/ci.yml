name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: make config
      - run: make test
      - run: make e2e
