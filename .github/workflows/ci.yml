name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Run all verification suites
        run: |
          status=0
          make config || status=1
          docker compose --env-file .env.example --profile test run --build --rm backend-test || status=1
          docker compose --env-file .env.example --profile test run --build --rm frontend-test || status=1
          make e2e || status=1
          exit "$status"
