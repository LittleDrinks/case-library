name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - run: make config
      - name: Backend test suite
        run: docker compose --env-file .env.example --profile test run --build --rm backend-test
      - name: Frontend test suite
        run: docker compose --env-file .env.example --profile test run --build --rm frontend-test
      - run: make e2e
