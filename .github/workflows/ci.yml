name: CI

on:
  pull_request:
  push:
    branches: [main, v2]
  workflow_call:

permissions:
  contents: read

env:
  COMPOSE_FILE: docker-compose.yml:deploy/ci-build-cache.compose.yml

jobs:
  config:
    name: Config
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Run config stage
        run: make config

  backend-test:
    name: Backend test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Run backend test stage
        run: make test-backend

  frontend-test:
    name: Frontend test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: Run frontend test stage
        run: make test-frontend

  e2e:
    name: E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: gha roundtrip probe (temp)
        run: |
          set -e
          prev=$(docker buildx inspect | sed -n 's/^Name: *//p')
          docker compose --env-file .env.example --profile e2e build e2e-app
          docker buildx create --name verify --driver docker-container --bootstrap
          docker buildx use verify
          docker compose --env-file .env.example --profile e2e build e2e-app 2>&1 | tee /tmp/probe2.log
          echo "VERIFY_CACHED_COUNT=$(grep -c 'CACHED' /tmp/probe2.log || true)"
          docker buildx use "$prev"
      - name: Run E2E stage
        run: make e2e
        env:
          E2E_ARTIFACT_DIR: ${{ runner.temp }}/e2e-artifacts
      - name: Upload failed E2E artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: ${{ runner.temp }}/e2e-artifacts
          retention-days: 14
          if-no-files-found: warn
