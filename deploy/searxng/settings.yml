use_default_settings: true

general:
  debug: false
  instance_name: "Case Library Search"
  enable_metrics: false

search:
  formats:
    - json
  # The adapter applies the exact candidate cap from SEARXNG_MAX_RESULTS.
  max_page: 1

server:
  port: 8080
  bind_address: "0.0.0.0"
  limiter: false
  public_instance: false
  image_proxy: false
  method: "GET"
  # Compose overrides this with SEARXNG_SECRET.
  secret_key: "replace-with-searxng-secret"

outgoing:
  request_timeout: 5.0
  max_request_timeout: 5.0
