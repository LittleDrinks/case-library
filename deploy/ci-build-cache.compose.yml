        - type=gha,mode=max,scope=production-config-check
  search-init:
    build:
      cache_from:
        - type=gha,scope=search-init
      cache_to:
        - type=gha,mode=max,scope=search-init
  search-worker:
    build:
      cache_from:
        - type=gha,scope=search-worker
      cache_to:
        - type=gha,mode=max,scope=search-worker
  searxng:
