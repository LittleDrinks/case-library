      cache_from:
        - type=gha,scope=agent-e2e-loser
      cache_to:
        - type=gha,mode=max,scope=agent-e2e-loser
  app:
    build:
      cache_from:
        - type=gha,scope=app
      cache_to:
        - type=gha,mode=max,scope=app
  backend-e2e:
    build:
      cache_from:
        - type=gha,scope=backend-e2e
      cache_to:
        - type=gha,mode=max,scope=backend-e2e
  backend-test:
    build:
      cache_from:
        - type=gha,scope=backend-test
      cache_to:
        - type=gha,mode=max,scope=backend-test
  e2e:
    build:
      cache_from:
        - type=gha,scope=e2e
      cache_to:
        - type=gha,mode=max,scope=e2e
  e2e-ai-provider:
    build:
      cache_from:
        - type=gha,scope=e2e-ai-provider
      cache_to:
        - type=gha,mode=max,scope=e2e-ai-provider
  e2e-app:
    build:
      cache_from:
        - type=gha,scope=e2e-app
      cache_to:
        - type=gha,mode=max,scope=e2e-app
  e2e-frontend:
    build:
      cache_from:
        - type=gha,scope=e2e-frontend
      cache_to:
        - type=gha,mode=max,scope=e2e-frontend
  e2e-meilisearch:
    build:
      cache_from:
        - type=gha,scope=e2e-meilisearch
      cache_to:
        - type=gha,mode=max,scope=e2e-meilisearch
  e2e-search-init:
    build:
      cache_from:
