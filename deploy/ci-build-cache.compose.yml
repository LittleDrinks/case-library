      cache_to:
        - type=gha,mode=max,scope=e2e-search-init
  e2e-search-worker:
    build:
      cache_from:
        - type=gha,scope=e2e-search-worker
      cache_to:
        - type=gha,mode=max,scope=e2e-search-worker
  frontend:
    build:
      cache_from:
        - type=gha,scope=frontend
      cache_to:
        - type=gha,mode=max,scope=frontend
  frontend-test:
    build:
      cache_from:
        - type=gha,scope=frontend-test
      cache_to:
        - type=gha,mode=max,scope=frontend-test
  meilisearch:
    build:
      cache_from:
        - type=gha,scope=meilisearch
      cache_to:
        - type=gha,mode=max,scope=meilisearch
  mongo-init:
    build:
      cache_from:
        - type=gha,scope=mongo-init
      cache_to:
        - type=gha,mode=max,scope=mongo-init
  production-config-check:
