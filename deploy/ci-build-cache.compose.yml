# CI-only override: BuildKit gha layer cache, one scope per service (v2 index is replace-per-scope).
services:
  agent-e2e:
    build:
      cache_from:
        - type=gha,scope=agent-e2e
      cache_to:
        - type=gha,mode=max,scope=agent-e2e
  agent-e2e-app:
    build:
      cache_from:
        - type=gha,scope=agent-e2e-app
      cache_to:
        - type=gha,mode=max,scope=agent-e2e-app
  agent-e2e-frontend:
    build:
      cache_from:
        - type=gha,scope=agent-e2e-frontend
      cache_to:
        - type=gha,mode=max,scope=agent-e2e-frontend
  agent-e2e-loser:
