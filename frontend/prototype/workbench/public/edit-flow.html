<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>局部 AI 修改 · 流程原型</title><style>
*{box-sizing:border-box}body{margin:0;background:#f3f1ed;color:#302e2b;font:15px/1.7 system-ui,sans-serif}header,main{max-width:1180px;margin:auto;padding:24px}header small{color:#977d67}h1{font-size:25px;margin:4px 0}p{margin:8px 0}button,select{font:inherit;padding:8px 14px;border:1px solid #d8d2c9;border-radius:7px;background:white;cursor:pointer}button:hover{border-color:#a52330}button:disabled{opacity:.4;cursor:default}.primary{background:#a52330;color:white;border-color:#a52330}.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.grid{display:grid;grid-template-columns:1.15fr 1fr;gap:20px}.card{padding:24px;background:white;border:1px solid #e0dbd3;border-radius:10px;margin-bottom:18px}h2{font-size:18px;margin:0 0 14px}textarea{width:100%;min-height:170px;padding:16px;border:1px solid #d8d2c9;border-radius:6px;font:17px/1.9 Georgia,serif;resize:vertical}small,.muted{color:#80776d}#notice{padding:12px;background:#f5eceb;border-radius:6px;min-height:50px}del{background:#fbe7e7}ins{background:#e8f1e8;text-decoration:none}.status{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.status b{display:block}.tabs button[aria-selected=true]{border-color:#a52330;background:#f5eceb}.steps{margin-top:12px}.paper{font:17px/1.9 Georgia,serif;white-space:pre-wrap}.history{padding:12px;background:#f7f5f1;margin-top:12px}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}.status{grid-template-columns:1fr 1fr}header,main{padding:16px}}
</style><header><small>交互原型 · 固定 AI 样例 · 内存状态 · 不写入正式系统</small><h1>点击“应用修改”后，正文应该发生什么？</h1><p>比较两种结果：修改当前稿，或保留当前稿并另存 AI 稿。只讨论局部修改，不含批注和整篇生成。</p><div class="row"><label for="mode">体验方案：</label><select id="mode"><option value="direct">A · 应用到当前正文</option><option value="version">B · 另存只读 AI 稿</option></select><button id="reset">重置本轮</button><small>切换方案会重置演示</small></div></header><main>
<section class="card status" id="status"></section><div class="grid"><section class="card"><h2>当前教师稿</h2><p class="muted">此处整段就是本轮选区，可自由编辑。点击“保存手动修改”提交你的改动。</p><textarea id="draft" aria-label="当前教师稿"></textarea><div class="row"><button id="manual">保存手动修改</button><button id="undo">撤销上一步修改</button></div><div id="versions"></div></section>
<section class="card"><h2>AI 对话</h2><p><b>你：</b>把这段话改得具体一点，给出可操作的课堂任务。</p><button id="generate">生成修改建议（模拟）</button><div id="proposal"></div><p id="notice" role="status" aria-live="polite"></p></section></div>
<section class="card"><h2>按场景试一遍</h2><div class="row tabs" id="tabs" role="tablist" aria-label="演示场景"></div><p id="scenario"></p><div class="row steps" id="steps"></div><p class="muted">这些行为是供讨论的候选规则，尚未成为正式产品决定。</p></section></main>
<script>
const initialText='课堂上，教师引导学生讨论科学家精神，加深理解，并进行总结。';
const replacement='课堂上，学生分组比较钱伟长两次专业选择的背景，分别找出个人志向与国家需要的依据；每组选一名代表说明判断，教师最后归纳不同选择背后的共同原则。';
function initial(mode='direct'){return{mode,doc:initialText,revision:0,candidate:null,versions:[],undo:[],notice:'先生成一条建议，观察正文是否发生变化。'};}
function reduce(s,a){const n=structuredClone(s),c=n.candidate;
 if(a.type==='generate'){n.candidate={base:n.doc,baseRevision:n.revision,text:replacement,status:'pending',preview:false};n.notice='建议已生成，当前正文没有改变。';}
 if(a.type==='preview'&&c?.status==='pending'){c.preview=!c.preview;n.notice=c.preview?'预览只显示差异，尚未写入正文。':'已关闭预览。';}
 if(a.type==='reject'&&c?.status==='pending'){c.status='rejected';n.notice='已拒绝建议，正文不变。';}
 if(a.type==='apply'&&c?.status==='pending'){
  if(n.doc!==c.base||n.revision!==c.baseRevision){c.status='stale';n.notice='正文在生成后发生变化，本次未应用。请基于当前稿重新生成。';}
  else if(n.mode==='version'){n.versions.push(c.text);c.status='saved';n.notice='已另存只读 AI 稿，当前教师稿仍然不变。';}
  else{n.undo.push({doc:n.doc,candidate:structuredClone(c)});n.doc=c.text;n.revision++;c.status='applied';c.preview=false;n.notice='已更新当前正文，可以撤销。';}
 }
 if(a.type==='manual'&&a.text!==n.doc){n.undo.push({doc:n.doc,candidate:structuredClone(c)});n.doc=a.text;n.revision++;n.notice='手动修改已保存，现有建议仍基于旧稿。';}
 if(a.type==='undo'&&n.undo.length){const prior=n.undo.pop();n.doc=prior.doc;n.revision++;n.candidate=prior.candidate;if(n.candidate?.base===n.doc)n.candidate.baseRevision=n.revision;n.notice='已撤销最近一次正文修改；更早的修改仍保留。';}
 return n;
}
const scenarios=[{name:'预览 → 应用 → 撤销',text:'观察生成和预览是否动正文，以及应用后正文在哪里。',steps:[['生成建议',{type:'generate'}],['预览差异',{type:'preview'}],['应用修改',{type:'apply'}],['撤销',{type:'undo'}]]},{name:'不喜欢这条建议',text:'拒绝后，原文应保持不变。',steps:[['生成建议',{type:'generate'}],['拒绝建议',{type:'reject'}]]},{name:'等待时自己改了正文',text:'AI 建议基于旧稿；尝试应用，观察是否覆盖你的手动改动。',steps:[['生成建议',{type:'generate'}],['模拟手动补充',{type:'manual',text:initialText+' 每组讨论五分钟。'}],['尝试应用旧建议',{type:'apply'}],['重新生成',{type:'generate'}]]},{name:'应用后又手动修改',text:'撤销按最近操作依次执行，不跳过后续手动修改。',steps:[['生成建议',{type:'generate'}],['应用修改',{type:'apply'}],['模拟再补一句',{type:'manual',text:replacement+' 课后提交一份讨论记录。'}],['撤销手动补充',{type:'undo'}],['再撤销 AI 修改',{type:'undo'}]]}];
let state=initial(),scenario=0,step=0;const $=id=>document.getElementById(id);const escape=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function dispatch(a){state=reduce(state,a);render();}
function render(){const c=state.candidate;const names={pending:'待应用',applied:'已应用',rejected:'已拒绝',stale:'原文已变化',saved:'已另存 AI 稿'};$('draft').value=state.doc;$('notice').textContent=state.notice;$('undo').disabled=!state.undo.length;$('status').innerHTML=`<div>当前稿<b>${state.doc===initialText?'初始正文':'已改变'}</b></div><div>修改建议<b>${names[c?.status]||'尚未生成'}</b></div><div>可撤销操作<b>${state.undo.length} 次</b></div><div>独立 AI 稿<b>${state.versions.length} 份</b></div>`;
 $('proposal').innerHTML=c?`<div class="history"><b>AI 修改建议</b><p class="paper">${escape(c.text)}</p>${c.preview?`<p><del>${escape(c.base)}</del></p><p><ins>${escape(c.text)}</ins></p>`:''}<div class="row"><button data-action="preview" ${c.status!=='pending'?'disabled':''}>${c.preview?'关闭预览':'预览差异'}</button><button class="primary" data-action="apply" ${c.status!=='pending'?'disabled':''}>${state.mode==='direct'?'应用修改':'另存 AI 稿'}</button><button data-action="reject" ${c.status!=='pending'?'disabled':''}>拒绝</button></div></div>`:'';
 $('proposal').querySelectorAll('[data-action]').forEach(b=>b.onclick=()=>dispatch({type:b.dataset.action}));$('versions').innerHTML=state.versions.map((v,i)=>`<div class="history"><b>只读 AI 稿 ${i+1}</b><p class="paper">${escape(v)}</p><small>独立稿件；没有覆盖上面的当前教师稿。</small></div>`).join('');
 $('tabs').innerHTML=scenarios.map((x,i)=>`<button role="tab" aria-selected="${i===scenario}" data-tab="${i}">${x.name}</button>`).join('');$('tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>{scenario=Number(b.dataset.tab);step=0;state=initial(state.mode);render();});$('scenario').textContent=scenarios[scenario].text;$('steps').innerHTML=scenarios[scenario].steps.map(([name],i)=>`<button data-step="${i}" ${i!==step?'disabled':''}>${i+1}. ${name}${i<step?' ✓':''}</button>`).join('');$('steps').querySelectorAll('button').forEach(b=>b.onclick=()=>{const a=scenarios[scenario].steps[step][1];step++;dispatch(a);});}
$('generate').onclick=()=>dispatch({type:'generate'});$('manual').onclick=()=>dispatch({type:'manual',text:$('draft').value});$('undo').onclick=()=>dispatch({type:'undo'});$('mode').onchange=()=>{state=initial($('mode').value);step=0;render();};$('reset').onclick=()=>{state=initial(state.mode);step=0;render();};render();
</script></html>
