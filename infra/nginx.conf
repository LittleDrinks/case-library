log_format upstream_probe '$request status=$status upstream_status=$upstream_status upstream=$upstream_addr load_marker=$http_x_load_probe';

resolver 127.0.0.11 valid=10s ipv6=off;

upstream backend {
    zone backend 64k;
    server app:8001 resolve max_fails=3 fail_timeout=10s;
    keepalive 512;
    keepalive_timeout 4s;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 129m;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        access_log /var/log/nginx/access.log upstream_probe;
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
