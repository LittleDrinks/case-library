// This is a standalone, memory-only logic prototype. Defaults await feedback.
const chapters=[{id:'c1',title:'第一章 · 世界的物质性',pages:'第 18–45 页',summary:'讨论物质、意识以及两者之间的关系。'},{id:'c2',title:'第二章 · 实践与认识',pages:'第 46–72 页',summary:'从实践活动出发，讨论认识的发展与检验。'},{id:'c3',title:'第三章 · 社会发展',pages:'第 73–108 页',summary:'暂无已收录内容。'},{id:'c4',title:'第四章 · 价值与选择',pages:'第 109–136 页',summary:'暂无已收录内容。'}];

function initial(){return {screen:'materials',view:'all',query:'',material:'book23',chapter:'c1',readerTab:'original',modal:false,statuses:{c1:'confirmed',c2:'pending',c3:'missing',c4:'missing'},job:'idle',defaultFile:'original',selected:['c1'],caseSource:null,answer:false,notice:'',userNotice:'',users:[{id:'chen',name:'陈老师',username:'chen',role:'普通用户',campus:'pending',active:true,mustChange:false,sessions:1},{id:'lin',name:'林老师',username:'lin',role:'普通用户',campus:'approved',active:true,mustChange:false,sessions:1},{id:'wu',name:'吴同学',username:'wu',role:'普通用户',campus:'none',active:false,mustChange:false,sessions:0},{id:'admin',name:'平台管理员',username:'manager',role:'管理员',campus:'approved',active:true,mustChange:false,sessions:1}]};}
// State changes live here; this function does not access the DOM or storage.
function transition(state,action){const s=structuredClone(state);s.notice='';switch(action.type){case 'screen':s.screen=action.value;s.modal=false;break;case 'scope':s.view=action.value;break;case 'query':s.query=action.value;break;case 'open':s.material=action.id||'book23';s.chapter=action.chapter||'c1';s.readerTab=action.tab||(s.material==='book23'?s.defaultFile:'original');s.modal=true;break;case 'close':s.modal=false;break;case 'chapter':s.chapter=action.id;break;case 'tab':s.readerTab=action.value;break;case 'parse':s.job='running';s.notice='正在处理第二章的页面；原件仍可阅读。';break;case 'parsed':s.job='done';if(s.statuses.c2!=='confirmed')s.statuses.c2='pending';s.notice=s.statuses.c2==='confirmed'?'本次生成新的候选正文，已有确认正文继续可用。':'第二章正文已返回，等待管理员核对。';break;case 'confirm':if(s.statuses[s.chapter]==='pending'){s.statuses[s.chapter]='confirmed';s.notice='本章原文已确认，可以供 AI 使用。';}break;case 'retry':s.job='failed';s.notice='本次识别失败；原件和已确认的第一章仍可使用。';break;case 'default':s.defaultFile=action.value;s.notice='推荐阅读入口已更新。';break;case 'select':s.selected=s.selected.includes(action.id)?s.selected.filter(x=>x!==action.id):[...s.selected,action.id];break;case 'add':if(s.selected.length){s.caseSource={material:s.material,chapters:[...s.selected],revision:'整理修订 1'};s.screen='case';s.modal=false;s.answer=false;}break;case 'ask':s.answer=true;break;case 'approve':s.users.find(u=>u.id===action.id).campus='approved';s.userNotice='陈老师的校内素材访问资格已开通，审批记录已留下（示例）。';break;case 'reset':{const u=s.users.find(u=>u.id===action.id);u.mustChange=true;u.sessions=0;s.userNotice=u.name+'需在下次登录时修改临时密码，旧会话已撤销（示例）。';break;}case 'toggle':{const u=s.users.find(u=>u.id===action.id);if(u.role==='管理员'&&u.active&&s.users.filter(v=>v.role==='管理员'&&v.active).length===1){s.userNotice='这是最后一个可用管理员，保留其管理权限。';break;}u.active=!u.active;if(!u.active)u.sessions=0;s.userNotice=u.name+(u.active?'已恢复访问。':'已停用；内容和归属保留，旧会话已撤销。');break;}case 'start-review':Object.assign(s,initial(),{modal:true,readerTab:'manage',chapter:'c2'});break;case 'start-use':Object.assign(s,initial(),{modal:true,readerTab:'pick',selected:['c1']});break;case 'reset-demo':return initial();}return s;}
const params=new URLSearchParams(location.search);let state=initial();if(['materials','users','plan','case'].includes(params.get('screen')))state.screen=params.get('screen');const standalone=!!params.get('detail');if(standalone){state.material=params.get('detail');state.modal=true;}

function paper(r){let c=chapters.find(x=>x.id===state.chapter);const available=state.material!=='book23'||state.statuses[c.id]!=='missing';if(!available)return '<div class="empty-reader"><div class="file-icon">PDF</div><h3>这一章尚未收录</h3><p>当前只收录第一、二章。已有章节和原件可以继续使用。</p></div>';if(state.readerTab==='text'&&state.material==='book23'&&state.statuses[c.id]!=='confirmed')return '<div class="empty-reader"><span class="badge pending">'+statusLabel[state.statuses[c.id]]+'</span><h3>正文等待核对</h3><p>现在可以看原 PDF；管理员确认这章正文后，AI 才会使用。</p><button class="btn" data-tab="original">查看原件</button><button class="btn small" data-tab="manage">查看处理与核对</button></div>';const isOCR=state.readerTab==='ocr';return '<p class="reading-hint">'+(state.readerTab==='text'?'已确认原文 · AI 可用':isOCR?'OCR PDF · 增加可搜索文字层，保留原件':'原 PDF · 页面阅读')+' · 页面内容均为演示</p><article class="paper"><div class="edition-line">'+r.title+' · '+r.edition+' · 示例页</div><h3>'+(state.material==='book23'?c.title:state.material==='book21'?'本书目录':'课程建设参考')+'</h3><p>'+ (state.material==='book23'?c.summary:'这里展示该资料的阅读入口。每一份出版版次或政策文件保留自己的来源。')+'</p><p>教学讨论可以从具体情境出发，结合原文理解概念，再形成适合课堂使用的问题。资料正文、教师自己的观点与管理员解读分别呈现。</p>'+(isOCR?'<div class="source-chip">可选中与搜索文字 · 原件仍保留</div>':'')+'<p style="font-size:12px;color:var(--muted)">此处为虚构的版面和文字，用于判断阅读与目录交互，不是实际教材摘录。</p><div class="page-number">'+(state.material==='book23'?c.pages.split('–')[0].replace('第 ',''):'1')+'</div></article>';}

><dt>覆盖范围</dt><dd>'+(isBook?'第 1–2 章 / 共 4 章':'整份资料')+'</dd></div></dl>'+ (isBook?'<div class="statebox"><h4>供 AI 使用的内容</h4><p>'+chapters.filter(c=>state.statuses[c.id]==='confirmed').map(c=>c.title.split(' · ')[0]).join('、')+'原文已确认。<br>待核对和未收录章节不进入 AI 正文。</p></div><label class="select-label" for="default-file">推荐阅读入口 · 草案</label><select id="default-file"><option value="original" '+(state.defaultFile==='original'?'selected':'')+'>原 PDF</option><option value="ocr" '+(state.defaultFile==='ocr'?'selected':'')+'>OCR PDF</option><option value="text" '+(state.defaultFile==='text'?'selected':'')+'>已确认原文正文</option></select><button class="btn soft" data-tab="pick">为案例选用</button><button class="btn" data-tab="manage">处理与核对</button>':'<div class="statebox"><h4>文件与正文分开</h4><p>原件已保存，正文可另行整理和确认。</p></div>')+'</aside></div><div class="modal-footer"><span>原文与整理／解读分别标明 · 当前演示默认原文</span><span>所有内容均为虚构示例</span></div></section>';}

function plan(){return intro('下一轮交付','把已定的用户管理先做成可运行闭环，素材流程以今晚反馈为界。')+nav()+'<div class="plan-grid"><article class="panel plan-card"><div class="number">01</div><h2>本地账号与用户管理</h2><p class="lead">产品规则已经定稿，可以作为第一轮 AFK 实施。</p><ul><li>自助注册、后台开户、用户列表</li><li>申请与审批校内素材资格</li><li>停用／恢复、角色管理、会话撤销</li><li>临时密码恢复与首次改密</li><li>私人内容隔离、最后管理员保护、操作记录</li></ul><p class="scope-note">交付：可运行分支、桌面与手机演示、独立验收记录、待审 PR。</p></article><article class="panel plan-card"><div class="number">02</div><h2>资料包的最小闭环</h2><p class="lead">先用一本具体版次的教材证明目录、文件和正文的关系。</p><ul><li>一条素材、多份文件与内部章节目录</li><li>原件先阅读，已确认正文才供 AI 使用</li><li>手动补正文、待核对／确认状态</li><li>选入案例，保留版次与使用范围</li><li>固定内容引用和完整备份覆盖</li></ul><p class="scope-note">此项待你看过原型后定范围。外部 OCR 入口已确定；真实供应商联调单独验收。</p></article></div><div class="panel plan-banner"><div><h3>今晚只需确认这四个默认值是否顺手</h3><p>部分章节可先开放 · 选材可指定章节 · 管理员选推荐阅读文件 · AI 默认原文</p></div><button class="btn primary" data-action="start-review">看资料处理流程 →</button></div><p class="small-note" style="margin-top:18px">合集保留 Later；学校 SSO 不阻塞。实施期间保留既有 M1 流程与旧原型。</p>';}
let returnFocus=null;
function render(){const root=document.getElementById('main'),overlay=document.getElementById('overlay');if(standalone){root.className='shell standalone';root.innerHTML=modal();overlay.innerHTML='';}else{root.className='shell';root.innerHTML=state.screen==='materials'?materials():state.screen==='users'?users():state.screen==='plan'?plan():casePage();overlay.innerHTML=state.modal?'<div class="overlay">'+modal()+'</div>':'';root.inert=state.modal;document.querySelector('.site').inert=state.modal;document.body.style.overflow=state.modal?'hidden':'';}bind();if(state.modal&&!standalone)overlay.querySelector('[aria-label="关闭详情"]')?.focus();}
function bind(){document.querySelectorAll('[data-screen]').forEach(el=>el.onclick=e=>{e.preventDefault();send('screen',{value:el.dataset.screen});});document.querySelectorAll('[data-action]').forEach(el=>el.onclick=()=>{const type=el.dataset.action;send(type);if(type==='add')document.getElementById('case-resources')?.focus();if(type==='close'&&returnFocus)document.querySelector('[data-open="'+returnFocus+'"]')?.focus();});document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>{returnFocus=el.dataset.open;send('open',{id:el.dataset.open});});document.querySelectorAll('[data-scope]').forEach(el=>el.onclick=()=>send('scope',{value:el.dataset.scope}));document.querySelectorAll('[data-chapter]').forEach(el=>el.onclick=()=>send('chapter',{id:el.dataset.chapter}));document.querySelectorAll('[data-tab]').forEach(el=>el.onclick=()=>send('tab',{value:el.dataset.tab}));document.querySelectorAll('[data-select]').forEach(el=>el.onchange=()=>send('select',{id:el.dataset.select}));document.querySelectorAll('[data-cite]').forEach(el=>el.onclick=()=>send('open',{id:'book23',chapter:el.dataset.cite,tab:'text'}));document.querySelectorAll('[data-approve]').forEach(el=>el.onclick=()=>send('approve',{id:el.dataset.approve}));document.querySelectorAll('[data-reset]').forEach(el=>el.onclick=()=>send('reset',{id:el.dataset.reset}));document.querySelectorAll('[data-toggle]').forEach(el=>el.onclick=()=>send('toggle',{id:el.dataset.toggle}));document.getElementById('default-file')?.addEventListener('change',e=>send('default',{value:e.target.value}));const search=document.getElementById('search');if(search)search.addEventListener('change',e=>send('query',{value:e.target.value}));const backdrop=document.querySelector('.overlay');if(backdrop)backdrop.onclick=e=>{if(e.target===backdrop)send('close');};}
document.addEventListener('keydown',e=>{if(!state.modal||standalone)return;if(e.key==='Escape'){send('close');return;}if(e.key==='Tab'){const elements=[...document.querySelector('.modal').querySelectorAll('button:not(:disabled),a[href],select,input:not(:disabled)')].filter(el=>el.getClientRects().length);const first=elements[0],last=elements[elements.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
render();
</script>
