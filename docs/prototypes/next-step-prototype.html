}
function fileRow(f,index){
 const name=state.rename===f.id?'<form class="rename-form" data-rename-form="'+f.id+'"><input aria-label="文件名" value="'+esc(f.name)+'" required><button type="submit">保存</button></form>':'<button class="file-choice '+(state.reader===f.id?'active':'')+'" data-reader="'+f.id+'">'+fileIcon(f.type)+'<span><strong>'+esc(f.name)+'</strong><small>'+[material.mainFile===f.id?'主文件':'',sizeLabel(f)].filter(Boolean).join(' · ')+'</small></span></button>';
 return '<div class="package-file">'+name+(state.manage?fileMenu(f,index):'')+'</div>';
}
function preview(){
 const f=activeFile();
 if(!f)return '<div class="empty-reader">素材包暂无文件</div>';
 if(f.type==='PDF')return '<div class="pdf-scroll" id="preview-scroll"><div class="pdf-sheet"><canvas id="pdf-canvas" aria-label="PDF 页面"></canvas></div><p class="preview-loading" id="load-state">正在打开 PDF…</p></div>';
 if(f.type==='MD')return state.editingText?'<div class="markdown-editor"><textarea id="markdown-editor" aria-label="Markdown 内容"></textarea></div>':'<div class="markdown-scroll" id="preview-scroll"><article class="markdown-body" id="markdown-body"></article></div>';
 if(['PNG','JPG','JPEG','WEBP','GIF','SVG'].includes(f.type))return '<div class="image-scroll"><img src="'+esc(f.url)+'" alt="'+esc(f.name)+'"></div>';
 return '<div class="empty-reader">此格式暂不支持预览<a class="link" href="'+esc(f.url)+'" download="'+esc(f.name)+'">下载文件</a></div>';
}
function detailMarkup(){
 const f=activeFile();
 const pdfControls=f?.type==='PDF'?'<div class="pdf-controls"><button id="page-prev" aria-label="上一页" title="上一页" '+(state.page<=1?'disabled':'')+'>'+readerIcon('previous')+'</button><input id="page-number" aria-label="PDF 页码" type="number" min="1" value="'+state.page+'"><span id="page-total">/ 364</span><button id="page-next" aria-label="下一页" title="下一页">'+readerIcon('next')+'</button></div>':'';
 const edit=state.manage&&f?.type==='MD'?'<button class="text-action" id="edit-markdown">'+(state.editingText?'保存内容':'编辑内容')+'</button>':'';
 const toc=f?.id==='original'?'<select id="chapter-nav" aria-label="目录">'+chapters.map(x=>'<option value="'+x.page+'" '+(state.page>=x.page&&state.page<(chapters[chapters.indexOf(x)+1]?.page||365)?'selected':'')+'>'+x.title+'</option>').join('')+'</select>':'';
 const download=f?'<a class="download-file" href="'+esc(f.url)+'" download="'+esc(f.name)+'" aria-label="下载当前文件" title="下载当前文件">'+readerIcon('download')+'</a>':'';
 return '<div class="detail-view"><div class="detail-grid"><section class="reader"><div class="reader-head"><div class="file-heading"><strong>'+esc(f?.name||'未选择文件')+'</strong></div><div class="reader-tools">'+pdfControls+toc+edit+download+'</div></div>'+preview()+'</section><aside class="side-info"><dl class="facts"><div><dt>版次</dt><dd>'+material.edition+'</dd></div><div><dt>来源</dt><dd><a href="'+material.sourceURL+'" target="_blank" rel="noopener noreferrer">'+material.source+'</a></dd></div><div><dt>访问范围</dt><dd>校内</dd></div></dl><div class="file-list"><div class="package-heading"><h3>素材包 <span>'+material.files.length+'</span></h3><button class="text-action" id="manage-package">'+(state.manage?'完成':'管理')+'</button></div>'+material.files.map(fileRow).join('')+(state.manage?'<input type="file" multiple hidden id="upload-files"><button class="add-files" id="add-files">＋ 添加文件</button>'+(state.undo?'<button class="text-action undo-file" id="undo-file">撤销移除</button>':''):'')+'</div></aside></div>'+(state.selectMode?'<div class="primary-bar"><p>当前案例：一次社区实践如何转化为课堂问题</p><button class="primary" id="add" '+(!material.files.length||state.done?'disabled':'')+'>'+(state.done?'已加入当前案例':'加入当前案例')+'</button></div>':'')+'</div>';
}
function detailPage(){return '<a class="back" href="next-step-prototype.html" data-back>← 返回资料库</a><div class="detail-top"><div><h1>'+material.title+'</h1><p>教材 · '+material.edition+'</p></div></div>'+detailMarkup();}
function casePage(){return '<div class="case-card"><a class="back" href="next-step-prototype.html" data-back>← 返回资料库</a><span class="tag">我的案例 · 草稿</span><h1>一次社区实践如何转化为课堂问题</h1><div class="case-content"><article><h2>教学情境</h2><p>教师组织学生走进社区，记录观察与访谈，围绕实践、认识与公共责任展开讨论。</p></article><aside class="case-resources"><h3>资料区</h3>'+(state.done?'<div class="source-card"><button class="title" data-case-material>'+material.title+'</button><p>'+material.edition+' · '+material.files.length+' 个文件</p></div>':'')+'<button class="link" id="choose-material">＋ 选择资料</button></aside></div></div>';}
function modal(){return '<div class="drawer-mask" data-backdrop><section class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title"><header class="drawer-header"><h2 class="drawer-title" id="drawer-title">'+material.title+'<small>教材 · '+material.edition+'</small></h2><div class="drawer-actions"><a class="drawer-open-page" href="'+detailURL()+'" target="_blank" rel="noopener noreferrer" aria-label="新标签页打开资料详情" title="新标签页打开资料详情">'+externalIcon+'</a><button class="drawer-close" id="close-drawer" aria-label="关闭资料详情">×</button></div></header><div class="drawer-body">'+detailMarkup()+'</div></section></div>';}
async function markdownText(f){if(f.content!==undefined)return f.content;const response=await fetch(f.url);if(!response.ok)throw Error('文件读取失败');f.content=await response.text();return f.content;}
async function drawActive(){
 const epoch=++drawEpoch;const f=activeFile();if(!f)return;
 try{
  if(f.type==='PDF'){
   const lib=await pdfLibPromise;if(epoch!==drawEpoch)return;
   if(!pdfCache.has(f.url))pdfCache.set(f.url,lib.getDocument({url:f.url,isEvalSupported:false,useSystemFonts:true}).promise);
   const doc=await pdfCache.get(f.url);if(epoch!==drawEpoch)return;
   state.page=Math.max(1,Math.min(doc.numPages,state.page));
   const total=$('#page-total');if(total)total.textContent='/ '+doc.numPages;
   const input=$('#page-number');if(input){input.value=state.page;input.max=doc.numPages;}
   const next=$('#page-next');if(next)next.disabled=state.page>=doc.numPages;
   const page=await doc.getPage(state.page);if(epoch!==drawEpoch)return;
   const canvas=$('#pdf-canvas');if(!canvas)return;
   const area=$('.pdf-scroll');const width=Math.min(830,Math.max(240,area.clientWidth-(innerWidth<650?24:64)));
   const viewport=page.getViewport({scale:width/page.getViewport({scale:1}).width});
   const ratio=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(viewport.width*ratio);canvas.height=Math.round(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';
   await page.render({canvasContext:canvas.getContext('2d'),viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;
   if(epoch===drawEpoch)$('#load-state')?.remove();
  }else if(f.type==='MD'){
   const text=await markdownText(f);if(epoch!==drawEpoch)return;
   if(state.editingText){$('#markdown-editor').value=text;return;}
   const article=$('#markdown-body');if(!article)return;
   article.innerHTML=window.markdownit({html:false,linkify:true}).render(text);
   article.querySelectorAll('img').forEach(img=>{const path=img.getAttribute('src');const companion=material.files.find(x=>x.name===path||x.name===decodeURIComponent(path)||x.url.endsWith('/'+path));img.src=companion?.url||new URL(path,new URL(base,location.href)).href;});
   article.querySelectorAll('a').forEach(a=>{a.target='_blank';a.rel='noopener noreferrer';});
  }
 }catch(error){if(epoch===drawEpoch){const target=$('#load-state')||$('#markdown-body');if(target)target.textContent='无法读取文件：'+error.message;}console.error(error);}
}
function render(){const root=$('#app'),overlay=$('#overlay-root');const hadModal=!!overlay.querySelector('.drawer');root.innerHTML=state.screen==='library'?library():state.screen==='detail'?detailPage():casePage();overlay.innerHTML=state.modal?modal():'';root.inert=state.modal;$('.site').inert=state.modal;document.body.style.overflow=state.modal?'hidden':'';bind();if(state.modal&&!state.rename)$('#close-drawer')?.focus();else if(hadModal&&state.screen==='library')$('[data-open]')?.focus();if(state.rename)$('[data-rename-form] input')?.focus();if(state.modal||state.screen==='detail')drawActive();else ++drawEpoch;}
function bind(){
 $('#chapter-nav')?.addEventListener('change',e=>set({page:Number(e.target.value)}));
 $('#page-prev')?.addEventListener('click',()=>set({page:Math.max(1,state.page-1)}));
 $('#page-next')?.addEventListener('click',()=>set({page:state.page+1}));
 $('#page-number')?.addEventListener('change',e=>set({page:Number(e.target.value)||1}));
 const q=$('#q');if(q){q.addEventListener('input',e=>set({query:e.target.value}));if(!state.modal){q.focus();q.setSelectionRange(q.value.length,q.value.length);}}
 document.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>set({screen:'library',modal:true,reader:material.mainFile,page:10,manage:false,editingText:false}));
 document.querySelectorAll('[data-reader]').forEach(el=>el.onclick=()=>set({reader:el.dataset.reader,editingText:false,rename:null}));
 $('#add')?.addEventListener('click',()=>set({screen:'case',modal:false,done:true,manage:false}));
 $('#choose-material')?.addEventListener('click',()=>set({screen:'library',modal:false,selectMode:true,query:''}));
 $('[data-case-material]')?.addEventListener('click',()=>set({modal:true,selectMode:false,reader:material.mainFile,page:10,manage:false,editingText:false}));
 $('#close-drawer')?.addEventListener('click',()=>set({modal:false,manage:false,editingText:false}));
 $('[data-backdrop]')?.addEventListener('click',e=>{if(e.target.matches('[data-backdrop]'))set({modal:false});});
 document.querySelectorAll('[data-back]').forEach(el=>el.onclick=e=>{e.preventDefault();history.replaceState({},'','next-step-prototype.html');set({screen:'library',modal:false});});
 $('#manage-package')?.addEventListener('click',()=>set({manage:!state.manage,rename:null,editingText:false}));
 $('#add-files')?.addEventListener('click',()=>$('#upload-files').click());
 $('#upload-files')?.addEventListener('change',async e=>{const added=[];for(const file of e.target.files){const extension=file.name.split('.').pop().toUpperCase();const type=['MD','MARKDOWN','TXT'].includes(extension)?'MD':extension;const item={id:'upload-'+crypto.randomUUID(),name:file.name,type,role:type==='MD'?'整理／解读':['PNG','JPG','JPEG','SVG'].includes(type)?'配图':'附件',bytes:file.size,url:URL.createObjectURL(file)};if(type==='MD')item.content=await file.text();material.files.push(item);added.push(item);}if(added.length)set({reader:added[0].id,editingText:false});});
 document.querySelectorAll('[data-rename]').forEach(el=>el.onclick=()=>set({rename:el.dataset.rename}));
 $('[data-rename-form]')?.addEventListener('submit',e=>{e.preventDefault();const value=e.target.querySelector('input').value.trim();const f=material.files.find(x=>x.id===e.target.dataset.renameForm);if(value&&f){f.name=value;set({rename:null});}});
 document.querySelectorAll('[data-main]').forEach(el=>el.onclick=()=>{material.mainFile=el.dataset.main;render();});
 document.querySelectorAll('[data-move]').forEach(el=>el.onclick=()=>{const index=material.files.findIndex(x=>x.id===el.dataset.move),target=index+Number(el.dataset.step);if(target>=0&&target<material.files.length){[material.files[index],material.files[target]]=[material.files[target],material.files[index]];render();}});
 document.querySelectorAll('[data-remove]').forEach(el=>el.onclick=()=>{const index=material.files.findIndex(x=>x.id===el.dataset.remove);if(index<0)return;const mainFile=material.mainFile;const [file]=material.files.splice(index,1);if(material.mainFile===file.id)material.mainFile=material.files[0]?.id;if(state.reader===file.id)state.reader=material.files[0]?.id;set({undo:{file,index,mainFile},editingText:false});});
 $('#undo-file')?.addEventListener('click',()=>{material.files.splice(state.undo.index,0,state.undo.file);material.mainFile=state.undo.mainFile;set({reader:state.undo.file.id,undo:null});});
 $('#edit-markdown')?.addEventListener('click',()=>{if(state.editingText){const f=activeFile();f.content=$('#markdown-editor').value;const blob=new Blob([f.content],{type:'text/markdown;charset=utf-8'});f.url=URL.createObjectURL(blob);f.bytes=blob.size;}set({editingText:!state.editingText});});
}
document.addEventListener('keydown',e=>{if(!state.modal)return;if(e.key==='Escape'){set({modal:false});return;}if(e.key==='Tab'){const controls=[...$('.drawer').querySelectorAll('button:not(:disabled),a[href],input:not(:disabled):not([hidden]),select,textarea,summary')].filter(el=>el.getClientRects().length);const first=controls[0],last=controls[controls.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus();}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus();}}});
$('#case-nav').onclick=e=>{e.preventDefault();set({screen:'case',modal:false,manage:false});};
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{if(state.modal||state.screen==='detail')drawActive();},150);});
render();
</script>
</body>
</html>
