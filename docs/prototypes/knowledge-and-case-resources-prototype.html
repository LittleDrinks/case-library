<!doctype html>
<!-- Three throwaway variants of resource management, next to the existing inventory prototype.
     ?variant=A|B|C; fixture data only, no persistence or application API calls. -->
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>知识与案例资料 · 讨论草图</title>
<style>
:root{--bg:#f8f6f2;--paper:#fff;--ink:#272522;--muted:#807c75;--line:#e6e1d9;--brand:#a42e34;--soft:#efeae3;--green:#34644b;--amber:#95682b;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:3px}button{border:0;background:transparent;color:inherit}header.site{height:76px;padding:0 5%;display:flex;align-items:center;justify-content:space-between;background:white;border-bottom:1px solid var(--line)}.brand{font-family:"Songti SC",serif;font-size:19px;font-weight:700}.site nav{display:flex;gap:26px;font-size:13px;color:var(--muted)}.site nav .current{color:var(--brand)}.sample{font-size:12px;color:var(--muted)}main{max-width:1280px;margin:auto;padding:26px 40px 110px}.back{font-size:12px;color:var(--muted);margin-bottom:24px}.heading{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:27px;font-family:"Songti SC",serif;margin:0;font-weight:650}h2{font-size:18px;font-weight:600;margin:0}.count{font-weight:400;font-size:12px;color:var(--muted);margin-left:9px}.split{display:grid;grid-template-columns:200px minmax(0,1fr);gap:35px}.side{border-right:1px solid var(--line);padding-right:20px}.side .group{font-size:11px;color:var(--muted);margin:0 0 10px}.side button{width:100%;display:flex;align-items:center;justify-content:space-between;text-align:left;padding:12px;border-radius:4px;margin-bottom:5px}.side button.active{color:var(--brand);background:#f2e8e6;font-weight:600}.side hr{border:0;border-top:1px solid var(--line);margin:22px 0}.subtle{color:var(--muted);font-size:12px}.privacy{margin-top:28px;padding-top:18px;border-top:1px solid var(--line)}.privacy strong{font-weight:500;color:var(--ink);display:block;margin-bottom:5px}.toolbar{display:flex;align-items:center;gap:12px;margin:18px 0 6px}.search{height:40px;flex:1;min-width:120px;border:1px solid var(--line);background:white;border-radius:5px;padding:0 12px}.filter{height:40px;border:1px solid var(--line);background:white;border-radius:5px;padding:0 10px;color:var(--muted)}.tablewrap{overflow:auto}table{border-collapse:collapse;width:100%;min-width:630px;text-align:left}th{font-size:11px;color:var(--muted);font-weight:500;padding:12px 10px;border-bottom:1px solid var(--line)}td{padding:16px 10px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:13px}th:first-child,td:first-child{padding-left:0}tbody tr:hover{background:#ffffff85}.filename{display:flex;gap:12px;align-items:center;min-width:235px}.fileicon{width:32px;height:38px;border:1px solid var(--line);border-radius:3px;display:grid;place-items:center;background:#fff;color:var(--brand);font-size:9px;flex-shrink:0}.filename strong{display:block;font-weight:550}.filename small{font-size:11px;color:var(--muted);display:block;margin-top:4px}.badge{font-size:11px;padding:3px 7px;border-radius:3px;white-space:nowrap;background:var(--soft);color:var(--muted)}.badge.active{color:var(--green);background:#e8f0e9}.badge.review{color:var(--amber);background:#f6ecd9}.action{color:var(--brand);white-space:nowrap;padding:5px 0}.empty{text-align:center;color:var(--muted);padding:48px}.strip{display:flex;gap:8px;align-items:center;margin:0 0 18px}.strip button{border:1px solid var(--line);border-radius:30px;padding:7px 15px;color:var(--muted)}.strip .active{color:var(--brand);border-color:#b46a6e;background:white}.summary{margin-top:16px;font-size:12px;color:var(--muted)}.collection{display:grid;grid-template-columns:280px minmax(0,1fr);gap:34px}.tree{background:#fff;border:1px solid var(--line);border-radius:5px;padding:12px}.tree .group{font-size:11px;color:var(--muted);padding:12px 10px 7px}.tree button{width:100%;text-align:left;padding:13px 10px;border-radius:4px}.tree button.active{background:#f2e8e6;color:var(--brand)}.tree small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.scope-note{font-size:12px;color:var(--muted);margin:8px 0 24px}.mask{position:fixed;inset:0;background:#25231f20;z-index:3;display:flex;justify-content:flex-end}.drawer{width:min(460px,95vw);height:100%;overflow:auto;background:white;padding:28px;box-shadow:-10px 0 40px #25231f12}.drawer-head{display:flex;justify-content:space-between;gap:20px;align-items:start}.drawer h2{font-size:20px;line-height:1.4;word-break:break-word;font-family:"Songti SC",serif}.close{font-size:23px;color:var(--muted);line-height:1}.preview{height:135px;background:#f4f1ec;border:1px solid var(--line);margin:26px 0 18px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:10px}.preview strong{font:32px/1 "Songti SC",serif;color:var(--brand)}.preview small{color:var(--muted);font-size:11px}.section{padding:19px 0;border-top:1px solid var(--line)}.section h3{font-weight:550;font-size:13px;margin:0 0 13px}.fact{display:flex;justify-content:space-between;gap:24px;font-size:12px;padding:5px 0}.fact span:first-child{color:var(--muted);flex-shrink:0}.fact span:last-child{text-align:right}.ref{border-left:2px solid var(--line);padding:2px 0 2px 12px;margin:11px 0;font-size:13px}.ref small{color:var(--muted);display:block;font-size:11px;margin-top:4px}.note{font-size:12px;color:var(--amber);background:#f8f0e0;padding:12px;line-height:1.7}.plain-note{font-size:12px;line-height:1.7;color:var(--muted)}details summary{font-size:12px;color:var(--muted);cursor:pointer}.switcher{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#292623;color:white;display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:30px;box-shadow:0 5px 24px #29262325;z-index:5}.switcher button{color:white;border-radius:50%;width:32px;height:30px;font-size:18px}.switcher span{text-align:center;min-width:210px;font-size:12px}.switcher small{display:block;color:#bfb8ad;font-size:10px}.legend{font-size:12px;color:var(--muted);padding:12px 0 0;border-top:1px solid var(--line);margin-top:24px}@media(max-width:850px){header.site{height:66px}.site nav{display:none}main{padding:22px 20px 110px}.split,.collection{grid-template-columns:1fr}.side{display:flex;border:0;padding:0;gap:8px}.side .group,.side hr,.side .privacy{display:none}.side button{width:auto}.tree{display:flex;overflow:auto}.tree .group,.tree small{display:none}.tree button{min-width:190px}.toolbar{flex-wrap:wrap}.search{width:100%}.switcher{bottom:15px}.brand{font-size:16px}}
</style>
</head>
<body>
<header class="site"><div class="brand">“强国有我”思政案例库</div><nav><span>首页</span><span>我的案例</span><span>资源检索</span><span class="current">管理后台</span></nav><span class="sample">讨论草图 · 示例数据</span></header>
<main id="app"></main>
<div id="detail"></div>
<div class="switcher" id="switcher"><button id="prev" aria-label="上一种布局">←</button><span id="variant-label"></span><button id="next" aria-label="下一种布局">→</button></div>
<script>
const data=[
 {id:'reading',name:'课题组共同阅读 · 第12期.pdf',type:'PDF',size:'6.2 MB',scope:'knowledge',description:'课题组学习资料',owner:'课题组',access:'校内',state:'active',status:'使用中',valid:'未设有效期',source:'课题组整理',version:'第 1 版',refs:[['城市记忆与社区更新','已发布 v2 · 资料区〔2〕'],['工程伦理与职业责任','已发布 v1 · 资料区〔3〕']]},
 {id:'textbook',name:'工程伦理教材 · 第3版.pdf',type:'PDF',size:'28.4 MB',scope:'knowledge',description:'教材',owner:'教学团队',access:'校内',state:'active',status:'使用中',valid:'未设有效期',source:'教学团队提供',version:'第 3 版',refs:[['工程伦理与职业责任','已发布 v1 · 资料区〔1〕']]},
 {id:'policy',name:'课程建设政策 · 2024版.pdf',type:'PDF',size:'1.8 MB',scope:'knowledge',description:'政策文件',owner:'教学团队',access:'公开',state:'review',status:'待核查',valid:'文件载明有效期至 2025-12-31',source:'主管部门官方网站',version:'2024 版',refs:[['城市记忆与社区更新','已发布 v2 · 资料区〔1〕']]},
 {id:'image',name:'社区调研现场照片.jpg',type:'JPG',size:'840 KB',scope:'case',description:'城市记忆与社区更新',owner:'案例作者',access:'公开',state:'active',status:'已发布',valid:'拍摄于 2025-04-18',source:'作者上传',version:'随案例发布 v2',refs:[['城市记忆与社区更新','已发布 v2 · 正文插图 / 资料区〔3〕']]},
 {id:'casepdf',name:'此次走访访谈摘要.pdf',type:'PDF',size:'260 KB',scope:'case',description:'城市记忆与社区更新',owner:'案例作者',access:'公开',state:'active',status:'已发布',valid:'此次走访的记录',source:'作者上传',version:'随案例发布 v2',refs:[['城市记忆与社区更新','已发布 v2 · 资料区〔4〕']]},
 {id:'diagram',name:'工程事故分析示意图.png',type:'PNG',size:'510 KB',scope:'case',description:'工程伦理与职业责任',owner:'案例作者',access:'公开',state:'active',status:'已发布',valid:'用于本案例说明',source:'作者制作',version:'随案例发布 v1',refs:[['工程伦理与职业责任','已发布 v1 · 正文插图 / 资料区〔2〕']]}
];
const variants={A:'分开入口',B:'统一清单',C:'按案例查看'};
let variant=new URLSearchParams(location.search).get('variant')||'A';
if(!variants[variant])variant='A';
let scope='knowledge',context='knowledge',query='',status='all';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const privacy='<div class="privacy subtle"><strong>私人资料 · 17 项 / 43 MB</strong>仅统计占用，不展示文件名和内容。</div>';
function toolbar(){return '<div class="toolbar"><input id="search" class="search" aria-label="搜索" placeholder="搜索文件名、来源或案例" value="'+esc(query)+'"><select id="status" class="filter" aria-label="状态"><option value="all"'+(status==='all'?' selected':'')+'>全部状态</option><option value="active"'+(status==='active'?' selected':'')+'>使用中 / 已发布</option><option value="review"'+(status==='review'?' selected':'')+'>待核查</option></select></div>'}
function rows(){return data.filter(x=>{
 const inScope=variant==='A'?(x.scope===scope):variant==='B'?(scope==='all'||x.scope===scope):context==='knowledge'?x.scope==='knowledge':x.refs.some(r=>r[0]===context);
 return inScope&&(status==='all'||x.state===status)&&(!query||JSON.stringify(x).toLowerCase().includes(query.toLowerCase()));
})}
function table(){const items=rows();return '<div class="tablewrap"><table><thead><tr><th>名称</th>'+(variant==='B'?'<th>归属</th>':'')+'<th>可见范围</th><th>使用</th><th>状态</th><th></th></tr></thead><tbody>'+items.map(x=>'<tr><td><div class="filename"><span class="fileicon">'+x.type+'</span><div><strong>'+esc(x.name)+'</strong><small>'+esc(x.description)+' · '+x.size+'</small></div></div></td>'+(variant==='B'?'<td>'+ (x.scope==='knowledge'?'通用知识':'案例资料')+'</td>':'')+'<td>'+x.access+'</td><td>'+x.refs.length+' 个案例</td><td><span class="badge '+x.state+'">'+x.status+'</span></td><td><button class="action" data-open="'+x.id+'">查看</button></td></tr>').join('')+(items.length?'':'<tr><td class="empty" colspan="6">没有匹配的资料</td></tr>')+'</tbody></table></div>'}
function VariantA(){return '<div class="heading"><h1>资料管理</h1></div><div class="split"><aside class="side"><p class="group">内容</p><button data-scope="knowledge" class="'+(scope==='knowledge'?'active':'')+'">知识 <small>3</small></button><button data-scope="case" class="'+(scope==='case'?'active':'')+'">案例资料 <small>3</small></button><hr>'+privacy+'</aside><section><h2>'+(scope==='knowledge'?'知识':'案例资料')+'<span class="count">'+rows().length+' 项</span></h2><p class="scope-note">'+(scope==='knowledge'?'可独立阅读，也可加入案例资料区。':'这里列出已发布案例使用的资料；私人草稿不在列表中。')+'</p>'+toolbar()+table()+'</section></div>'}
function VariantB(){return '<div class="heading"><h1>资料<span class="count">'+rows().length+' 项</span></h1></div><div class="strip"><button data-scope="all" class="'+(scope==='all'?'active':'')+'">全部</button><button data-scope="knowledge" class="'+(scope==='knowledge'?'active':'')+'">通用知识</button><button data-scope="case" class="'+(scope==='case'?'active':'')+'">案例资料</button></div>'+toolbar()+table()+'<div class="summary">私人资料 17 项 / 43 MB · 仅统计占用，不展示文件名和内容。</div>'}
function VariantC(){return '<div class="heading"><h1>资料使用</h1></div><div class="collection"><aside class="tree"><div class="group">通用内容</div><button data-context="knowledge" class="'+(context==='knowledge'?'active':'')+'">知识<small>3 份文档 · 可跨案例使用</small></button><div class="group">已发布案例</div><button data-context="城市记忆与社区更新" class="'+(context==='城市记忆与社区更新'?'active':'')+'">城市记忆与社区更新<small>2 份专用资料 · 2 份知识引用</small></button><button data-context="工程伦理与职业责任" class="'+(context==='工程伦理与职业责任'?'active':'')+'">工程伦理与职业责任<small>1 份专用资料 · 2 份知识引用</small></button></aside><section><h2>'+esc(context==='knowledge'?'知识':context)+'</h2><p class="scope-note">'+(context==='knowledge'?'这些文档不需要依附某个案例才能存在。':'专用资料和引用的知识一起出现在该案例资料区。')+'</p>'+toolbar()+table()+'</section></div><div class="legend">私人资料 17 项 / 43 MB · 仅统计占用。</div>'}
function bind(){document.querySelectorAll('[data-scope]').forEach(b=>b.onclick=()=>{scope=b.dataset.scope;query='';render()});document.querySelectorAll('[data-context]').forEach(b=>b.onclick=()=>{context=b.dataset.context;query='';render()});document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>open(b.dataset.open));document.getElementById('search').oninput=e=>{query=e.target.value;const p=e.target.selectionStart;render();const n=document.getElementById('search');n.focus();n.setSelectionRange(p,p)};document.getElementById('status').onchange=e=>{status=e.target.value;render()}}
function render(){document.getElementById('app').innerHTML='<div class="back">管理后台 / 资料</div>'+({A:VariantA,B:VariantB,C:VariantC}[variant])();document.getElementById('variant-label').innerHTML=variant+' · '+variants[variant]+'<small>三种草图 · ← → 切换</small>';document.body.dataset.variant=variant;bind()}
function open(id){const x=data.find(x=>x.id===id);document.getElementById('detail').innerHTML='<div class="mask"><aside class="drawer" role="dialog" aria-modal="true" aria-label="'+esc(x.name)+'"><div class="drawer-head"><h2>'+esc(x.name)+'</h2><button class="close" id="close" aria-label="关闭">×</button></div><div class="preview"><strong>'+x.type+'</strong><small>'+x.size+' · 内容预览位置</small></div><section class="section"><h3>这是什么</h3><div class="fact"><span>归属</span><span>'+esc(x.scope==='knowledge'?'通用知识':x.description+' · 案例资料')+'</span></div><div class="fact"><span>来源</span><span>'+esc(x.source)+'</span></div><div class="fact"><span>可见范围</span><span>'+x.access+'</span></div><div class="fact"><span>当前版本</span><span>'+x.version+'</span></div></section><section class="section"><h3>在哪里使用</h3>'+x.refs.map(r=>'<div class="ref">'+esc(r[0])+'<small>'+esc(r[1])+'</small></div>').join('')+'</section><section class="section"><h3>时间与适用性</h3><p class="plain-note">'+esc(x.valid)+'</p>'+(x.state==='review'?'<div class="note">这份政策可能已有后续文件。草图将它标为“待核查”；到期是否自动限制使用，尚待你决定。</div>':'<p class="plain-note">资料属于案例还是知识，与它是否仍适用分别判断。</p>')+'</section><section class="section"><details><summary>技术信息</summary><div class="fact"><span>原文件</span><span>对象存储</span></div><div class="fact"><span>资料记录与引用</span><span>数据库</span></div><p class="plain-note">统一存储不要求采用统一的知识与案例资料入口。</p></details></section></aside></div>';document.getElementById('close').onclick=close;document.querySelector('.mask').onclick=e=>{if(e.target.classList.contains('mask'))close()};document.getElementById('close').focus()}
function close(){document.getElementById('detail').innerHTML=''}
function cycle(delta){const keys=Object.keys(variants);variant=keys[(keys.indexOf(variant)+delta+3)%3];scope=variant==='B'?'all':'knowledge';context='knowledge';query='';status='all';close();const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);render()}
document.getElementById('prev').onclick=()=>cycle(-1);document.getElementById('next').onclick=()=>cycle(1);
document.addEventListener('keydown',e=>{if(e.key==='Escape')close();if(e.target.closest('input,textarea,select,[contenteditable]'))return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});
// This standalone document never participates in a production build.
if(location.protocol!=='file:'&&!['localhost','127.0.0.1','::1'].includes(location.hostname))document.getElementById('switcher').hidden=true;
if(variant==='B')scope='all';render();
</script>
</body>
</html>
