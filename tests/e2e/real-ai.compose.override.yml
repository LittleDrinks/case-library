services:
  e2e:
    user: "${REAL_AI_RUN_UID:?Set by the runner}:${REAL_AI_RUN_GID:?Set by the runner}"
    environment:
      PLAYWRIGHT_BASE_URL: http://frontend
      REAL_AI_PROVIDER_BASE_URL: ${REAL_AI_PROVIDER_BASE_URL:?Set REAL_AI_PROVIDER_BASE_URL in the explicit env file}
      REAL_AI_PREFERRED_MODEL: ${REAL_AI_PREFERRED_MODEL:-deepseek-v3}
      REAL_AI_SOURCE_HASH: ${REAL_AI_SOURCE_HASH:?Generated by the runner}
      REAL_AI_REPORT_NAME: ${REAL_AI_REPORT_NAME:?Generated by the runner}
      REAL_AI_REPORT_PATH: /app/test-results/${REAL_AI_REPORT_NAME}/report.json
      REAL_AI_APP_IMAGE_ID: ${REAL_AI_APP_IMAGE_ID:?Verified by the runner}
      REAL_AI_TEST_IMAGE_ID: ${REAL_AI_TEST_IMAGE_ID:?Verified by the runner}
      REAL_AI_FRONTEND_IMAGE_ID: ${REAL_AI_FRONTEND_IMAGE_ID:?Verified by the runner}
      REAL_AI_BACKEND_TEST_IMAGE_ID: ${REAL_AI_BACKEND_TEST_IMAGE_ID:?Verified by the runner}
      REAL_AI_APP_SOURCE_HASH: ${REAL_AI_APP_SOURCE_HASH:?Verified by the runner}
      REAL_AI_TEST_SOURCE_HASH: ${REAL_AI_TEST_SOURCE_HASH:?Verified by the runner}
      REAL_AI_FRONTEND_DIST_HASH: ${REAL_AI_FRONTEND_DIST_HASH:?Verified by the runner}
      REAL_AI_BUILD_MANIFEST_HASH: ${REAL_AI_BUILD_MANIFEST_HASH:?Generated by the runner}
    secrets:
      - real_ai_provider_key
      - real_ai_admin_credentials
    volumes:
      - ./frontend/playwright.real-ai.config.js:/app/playwright.real-ai.config.js:ro
      - ./frontend/tests/e2e/real-ai-account-flow.spec.js:/app/tests/e2e/real-ai-account-flow.spec.js:ro
      - ./frontend/tests/e2e/real-ai-safe-reporter.js:/app/tests/e2e/real-ai-safe-reporter.js:ro
      - ./frontend/tests/e2e/agent-panel.js:/app/tests/e2e/agent-panel.js:ro
      - type: bind
        source: ${REAL_AI_ARTIFACTS_DIR:?Provided by the runner}
        target: /app/test-results
        read_only: false
    command:
      - npm
      - run
      - test:e2e
      - --
      - --config=playwright.real-ai.config.js
      - --workers=1

  e2e-app:
    environment:
      AI_BASE_URL: ""
      AI_API_KEY_FILE: ""
      AI_MODELS: ""
      AI_DEFAULT_MODEL: ""
    networks:
      real_ai_egress:
        gw_priority: 1
    extra_hosts:
      - ai-provider:127.0.0.1
    logging:
      driver: none

  backend-e2e:
    environment:
      MONGODB_URI: mongodb://mongo1:27017,mongo2:27017,mongo3:27017/case_library_worker361?replicaSet=rs0&retryWrites=true&w=majority&appName=case-lib-worker361-cleanup
      MONGODB_DB_NAME: case_library_worker361
      SEARCH_URL: http://e2e-meilisearch:7700
      SEARCH_INDEX_UID: catalog_worker361
      SEARCH_API_KEY_FILE: /run/secrets/meili_master_key
    secrets:
      - meili_master_key
    volumes:
      - ${REAL_AI_ARTIFACTS_DIR:?Provided by the runner}:/app/test-results:ro
      - ./scripts/clear_real_ai_e2e.py:/app/scripts/clear_real_ai_e2e.py:ro

networks:
  real_ai_egress:
    driver: bridge
    ipam:
      config:
        - subnet: ${REAL_AI_EGRESS_SUBNET:?Set the reserved egress subnet in the explicit env file}

secrets:
  real_ai_provider_key:
    file: ${REAL_AI_PROVIDER_KEY_FILE:?Set REAL_AI_PROVIDER_KEY_FILE in the explicit env file}
  real_ai_admin_credentials:
    file: ${REAL_AI_ADMIN_CREDENTIALS_FILE:?Set REAL_AI_ADMIN_CREDENTIALS_FILE in the explicit env file}
