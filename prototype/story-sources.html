<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原型｜资料范围与附件</title>
  <style>
    :root { --ink:#18212f; --muted:#6c7786; --line:#dbe2ea; --paper:#fff; --bg:#f3f6f8; --navy:#14364d; --teal:#137f79; --teal-soft:#e1f3f0; --blue:#2768b0; --blue-soft:#e8f0fa; --amber:#b96b05; --amber-soft:#fff2dc; --red:#b7443e; --red-soft:#fdebea; --shadow:0 12px 32px rgba(25,45,63,.10); }
    * { box-sizing:border-box; } body { margin:0; color:var(--ink); background:var(--bg); font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; } button,input { font:inherit; } button { cursor:pointer; }
    .topbar { height:56px; display:flex; align-items:center; gap:18px; padding:0 28px; color:#f5fbff; background:var(--navy); }.mark { display:grid; width:28px; height:28px; place-items:center; color:var(--navy); background:#bde5db; font-weight:800; }.product { font-size:15px; font-weight:700; }.crumb { color:#b6c8d2; font-size:13px; }.top-status { display:flex; align-items:center; gap:8px; margin-left:auto; color:#d6e3e9; font-size:12px; }.dot { width:7px; height:7px; border-radius:50%; background:#78d7bf; }
    main { max-width:1440px; margin:0 auto; padding:24px 28px 32px; }.headline { display:flex; align-items:end; justify-content:space-between; gap:24px; margin-bottom:18px; } h1 { margin:0; font-size:23px; line-height:1.25; letter-spacing:0; }.intro { margin:5px 0 0; color:var(--muted); }.demo-tag { padding:5px 9px; border:1px solid #aac3cf; color:#28556a; background:#eaf4f7; font-size:12px; font-weight:700; }
    .scenes { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-bottom:14px; }.scene-tab { min-height:61px; padding:9px 12px; border:1px solid var(--line); color:#415260; background:#fff; text-align:left; }.scene-tab:hover { border-color:#83aaa7; }.scene-tab.active { border-color:var(--teal); color:#145d58; background:var(--teal-soft); box-shadow:inset 0 3px var(--teal); }.scene-num { display:block; color:var(--teal); font-size:11px; font-weight:800; }.scene-name { display:block; margin-top:2px; font-size:13px; font-weight:800; }
    .story { display:grid; grid-template-columns:255px minmax(0,1fr) 314px; min-height:625px; border:1px solid var(--line); background:#fff; box-shadow:var(--shadow); }.sidebar { padding:20px 16px; border-right:1px solid var(--line); background:#fbfcfd; }.workspace { min-width:0; padding:20px 22px; }.detail { padding:20px 16px; border-left:1px solid var(--line); background:#fbfcfd; }
    .eyebrow { color:#5f6c7a; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }.side-title { margin:5px 0 4px; font-size:16px; }.side-copy { margin:0 0 16px; color:var(--muted); font-size:12px; }.scope-list { display:grid; gap:8px; }.scope { display:flex; align-items:center; gap:9px; min-height:43px; padding:9px 10px; border:1px solid transparent; background:#fff; }.scope.selected { border-color:#a8d8d2; background:#f0faf8; }.scope input { width:16px; height:16px; accent-color:var(--teal); }.scope b,.scope span { display:block; }.scope b { font-size:13px; }.scope span { margin-top:1px; color:var(--muted); font-size:11px; }.scope input:disabled { opacity:1; }.limit-box { margin-top:18px; padding:12px; border-left:3px solid var(--teal); background:var(--teal-soft); }.limit-box b { display:block; font-size:12px; }.limit-box p { margin:4px 0 0; color:#39625e; font-size:12px; }
    .flow-head { display:flex; align-items:start; justify-content:space-between; gap:12px; }.flow-head h2 { margin:3px 0 0; font-size:17px; }.run-state { padding:4px 8px; color:#35616b; background:#eaf6f4; font-size:12px; font-weight:700; white-space:nowrap; }.timeline { display:grid; gap:3px; margin:16px 0 13px; }.tick { height:5px; background:#dce5e9; }.tick.active { background:var(--teal); }.feedback { min-height:54px; padding:12px 14px; border:1px solid #cbdfe4; background:#f4fafb; color:#254957; }.feedback b { color:var(--navy); }
    .tool-boundary { display:flex; align-items:center; gap:8px; min-height:34px; margin:16px 0 10px; padding:0 10px; border:1px solid var(--line); color:var(--muted); background:#fbfcfd; font-size:12px; }.tool-boundary b { color:var(--navy); }.search-row,.url-row,.filter-row { display:flex; gap:8px; }.search-row { margin:16px 0 10px; }.search-row input,.url-row input { min-width:0; flex:1; height:38px; padding:0 11px; border:1px solid #becbd5; outline:none; }.search-row input:focus,.url-row input:focus { border-color:var(--teal); box-shadow:0 0 0 3px rgba(19,127,121,.12); }.btn { min-height:38px; padding:0 13px; border:1px solid #bdcbd3; color:#24424e; background:#fff; font-weight:700; }.btn:hover { border-color:#598d99; background:#f4fafb; }.btn.primary { border-color:var(--teal); color:#fff; background:var(--teal); }.btn:disabled { cursor:not-allowed; opacity:.5; }
    .results { display:grid; gap:8px; }.result { display:grid; grid-template-columns:94px minmax(0,1fr) auto; align-items:center; gap:10px; min-height:61px; padding:10px; border:1px solid var(--line); background:#fff; }.result.off { opacity:.38; background:#f8fafb; }.result.focus { border-color:#68bbb2; background:#f4fbfa; box-shadow:inset 3px 0 var(--teal); }.kind,.outcome,.filter { width:max-content; padding:3px 6px; font-size:11px; font-weight:800; }.kind.knowledge { color:#226153; background:var(--teal-soft); }.kind.case { color:#2a5f98; background:var(--blue-soft); }.kind.material { color:#925100; background:var(--amber-soft); }.kind.web { color:#9d3c39; background:var(--red-soft); }.result h3 { margin:0; font-size:13px; }.result p { margin:2px 0 0; color:var(--muted); font-size:12px; }.outcome { border:1px solid currentColor; white-space:nowrap; }.outcome.context { color:#287a6e; }.outcome.cite { color:#3b78b9; }.outcome.attach { color:#a55b00; }.outcome.copy { color:#b74642; }
    .web-box,.material-box { margin-top:16px; padding:12px; border:1px dashed #aebfc8; background:#fafcfd; }.web-title { margin:0 0 8px; color:#697787; font-size:12px; font-weight:800; }.url-row input:disabled { color:#929eaa; background:#eef2f4; }.filter-row { flex-wrap:wrap; }.filter { border:1px solid #cbd5dc; color:#63717d; background:#fff; }.filter.active { border-color:#78b9b2; color:#17645f; background:#ecf8f6; }.asset-grid { display:grid; gap:8px; margin-top:11px; }.asset { display:flex; align-items:center; gap:9px; padding:10px; border:1px solid var(--line); background:#fff; }.asset.off { opacity:.38; }.asset.focus { border-color:#d7a664; background:#fffaf2; }.file { display:grid; width:28px; height:32px; place-items:center; color:#a65b00; background:#fff0d5; font-size:10px; font-weight:800; }.asset b { display:block; font-size:12px; }.asset span { display:block; color:var(--muted); font-size:11px; }
    .panel-label { color:#5f6c7a; font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }.sink { margin-top:11px; border:1px solid var(--line); background:#fff; }.sink-head { display:flex; align-items:center; justify-content:space-between; padding:10px 11px; border-bottom:1px solid var(--line); font-size:13px; font-weight:800; }.count { display:grid; min-width:20px; height:20px; place-items:center; color:#fff; background:var(--navy); font-size:11px; }.sink-body { min-height:83px; padding:10px 11px; }.empty { color:#8a96a2; font-size:12px; }.item { display:flex; gap:8px; padding:8px 0; border-bottom:1px solid #eef1f3; }.item:last-child { border-bottom:0; }.stripe { width:3px; flex:none; background:var(--teal); }.stripe.case { background:var(--blue); }.stripe.material { background:var(--amber); }.stripe.web { background:var(--red); }.item b { display:block; font-size:12px; }.item span { display:block; color:var(--muted); font-size:11px; }.guard { margin-top:14px; padding:11px; border:1px solid #f0cf9c; color:#825009; background:#fff7e9; font-size:12px; }
    .controls { display:flex; align-items:center; gap:8px; margin-top:16px; padding:12px; border:1px solid var(--line); background:#fff; }.step-btn { margin-left:8px; }.time { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; font-size:12px; }
    @media (max-width:1050px) { .story { grid-template-columns:235px minmax(0,1fr); }.detail { grid-column:1 / -1; display:grid; grid-template-columns:repeat(3,1fr); gap:12px; border-top:1px solid var(--line); border-left:0; }.panel-label { grid-column:1 / -1; }.sink,.guard { margin-top:0; } }
    @media (max-width:720px) { .topbar { padding:0 16px; }.crumb { display:none; } main { padding:18px 12px; }.headline { align-items:start; }.scenes { grid-template-columns:repeat(2,1fr); }.story { display:block; }.sidebar,.detail { border:0; border-bottom:1px solid var(--line); }.detail { display:block; }.sink,.guard { margin-top:11px; }.workspace { padding:18px 14px; }.result { grid-template-columns:78px minmax(0,1fr); }.outcome { grid-column:2; }.controls { flex-wrap:wrap; }.step-btn { margin-left:0; }.time { margin-left:auto; } }
  </style>
</head>
<body>
  <header class="topbar"><div class="mark">思</div><div class="product">案例创作工作台</div><div class="crumb">钱伟长专题案例 / 资料工具</div><div class="top-status"><i class="dot"></i>草稿已保存</div></header>
  <main>
    <section class="headline"><div><h1>资料范围、引用与附件</h1><p class="intro">四个短场景检验资料工具的边界与各类结果的归处。</p></div><span class="demo-tag">交互原型 · 场景 5–8</span></section>
    <nav class="scenes" id="scenes" aria-label="故事场景"></nav>
    <section class="story"><aside class="sidebar" id="sidebar"></aside><section class="workspace"><div class="flow-head"><div><div class="eyebrow" id="scene-kicker"></div><h2 id="scene-title"></h2></div><span class="run-state" id="run-state"></span></div><div class="timeline" id="timeline"></div><div class="feedback" id="feedback"></div><div id="content"></div><div class="controls"><button class="btn primary" id="play" title="从当前步骤继续播放">播放</button><button class="btn" id="pause" title="暂停自动演示">暂停</button><button class="btn" id="replay" title="从开始重新播放">重播</button><button class="btn step-btn" id="next" title="手动推进一个步骤">执行下一步</button><span class="time" id="time"></span></div></section><aside class="detail"><div class="panel-label">当前案例去向</div><div id="destinations"></div><div class="guard" id="guard"></div></aside></section>
  </main>
  <script>
    const names = { knowledge:'理论知识', platform:'平台案例与素材', online:'联网检索', web:'网页采集' };
    const keys = { scope:5, search:6, web:7, materials:8 };
    const scenes = {
      5: { key:'scope', name:'选择资料范围', duration:15, scope:['knowledge','platform','online'], steps:[[0,'等待选择。资料工具尚未获得任何来源。'],[2,'杨老师勾选理论知识，允许它进入 AI 检索上下文。'],[4,'杨老师勾选平台案例与素材：两类资料后续会有不同去向。'],[6,'杨老师勾选联网检索，补充公开资料线索。'],[8,'资料工具收到本次范围，只能从已勾选来源返回结果。'],[10,'杨老师取消联网检索，验证工具边界立即收紧。'],[12,'重新勾选联网检索，范围更新后立即生效。'],[15,'范围确认：本次资料工具受三项勾选限制。']] },
      6: { key:'search', name:'平台检索结果分流', duration:14, scope:['knowledge','platform','online'], steps:[[0,'准备检索“钱伟长”。平台案例与素材属于同一资料范围，但不能去同一个位置。'],[2,'杨老师检索“钱伟长”；结果只来自已勾选来源。'],[4,'理论知识进入 AI 检索上下文，用于生成与问答。'],[6,'平台案例被写入正文引用，保留案例身份。'],[8,'平台素材加入当前案例附件。'],[10,'附件区只显示素材，不出现平台案例。'],[12,'联网检索结果只提供公开资料线索，不自动成为附件。'],[14,'分流完成：知识给 AI，案例作引用，素材作附件。']] },
      7: { key:'web', name:'网页采集成为附件', duration:15, scope:['knowledge','platform','online','web'], steps:[[0,'网页采集未启用，URL 不能提交。'],[2,'杨老师勾选网页采集，本次资料范围允许采集网页。'],[4,'网页采集工具开放 URL 输入。'],[6,'杨老师粘贴钱伟长档案网页 URL。'],[8,'提交采集，平台固定网页内容。'],[10,'系统生成可追溯的网页副本。'],[12,'网页副本直接写入当前案例附件。'],[15,'采集完成：网页副本是附件，不是正文引用。']] },
      8: { key:'materials', name:'素材掌控台挂载附件', duration:16, scope:['platform'], steps:[[0,'进入素材掌控台，当前案例为“钱伟长专题案例”。'],[2,'杨老师筛选来源权威性：馆藏与高校。'],[4,'再筛选素材类型：图片与扫描件。'],[6,'结果缩小为可用的“钱伟长教学影像与手稿”。'],[8,'杨老师选中这项平台素材。'],[10,'点击“挂载到当前案例”。'],[12,'素材挂载关系写入当前案例附件。'],[14,'素材掌控台仍保留素材来源；案例草稿只持有附件关系。'],[16,'挂载完成：素材出现在当前案例附件区。']] }
    };
    const state = { current:keys[new URLSearchParams(location.search).get('scene')] || 5, stages:{ 5:0, 6:0, 7:0, 8:0 }, scopeOverride:null, playing:false };
    let timer = null;
    const el = id => document.getElementById(id); const scene = () => scenes[state.current]; const stage = () => state.stages[state.current]; const at = () => scene().steps[stage()][0]; const text = () => scene().steps[stage()][1]; const isAt = value => stage() >= value; const time = value => `00:${String(value).padStart(2,'0')}`;
    function checkbox(key, label, hint, checked, editable) { return `<label class="scope ${checked ? 'selected' : ''}"><input type="checkbox" data-scope="${editable ? key : ''}" ${checked ? 'checked' : ''} ${editable ? '' : 'disabled'}><span><b>${label}</b><span>${hint}</span></span></label>`; }
    function activeScopes() {
      if (state.current === 5 && state.scopeOverride) return state.scopeOverride;
      if (state.current === 5 && stage() === 0) return [];
      if (state.current === 5 && stage() === 1) return ['knowledge'];
      if (state.current === 5 && stage() === 2) return ['knowledge','platform'];
      if (state.current === 5 && stage() === 5) return ['knowledge','platform'];
      if (state.current === 7 && !isAt(1)) return ['knowledge','platform','online'];
      return scene().scope;
    }
    function scopePane() { const list = activeScopes(), editable = state.current === 5; const note = editable ? '可直接勾选，立即更新本次授权。' : '资料工具只读取本次允许的来源。'; return `<div class="eyebrow">本次资料范围</div><h3 class="side-title">资料来源勾选</h3><p class="side-copy">${note}</p><div class="scope-list">${checkbox('knowledge','理论知识','进入 AI 检索上下文',list.includes('knowledge'),editable)}${checkbox('platform','平台案例与素材','案例引用，素材附加',list.includes('platform'),editable)}${checkbox('online','联网检索','公开资料线索',list.includes('online'),editable)}${checkbox('web','网页采集','URL 生成网页副本',list.includes('web'),editable)}</div><div class="limit-box"><b>资料工具边界</b><p>${list.map(key => names[key]).join('、') || '未选择来源'}</p></div>`; }
    function item(title, type, note, shown, focused) { const kind = { knowledge:'理论知识', case:'平台案例', material:'平台素材', web:'联网检索' }[type]; const outcome = { knowledge:'供 AI 检索', case:'写入引用', material:'加入附件', web:'检索线索' }[type]; const outcomeClass = { knowledge:'context', case:'cite', material:'attach', web:'copy' }[type]; return `<article class="result ${shown ? '' : 'off'} ${focused ? 'focus' : ''}"><span class="kind ${type}">${kind}</span><div><h3>${title}</h3><p>${shown ? note : '不在本次勾选范围内，资料工具不返回'}</p></div><span class="outcome ${outcomeClass}">${outcome}</span></article>`; }
    function searchContent() { const found = isAt(1); return `<div class="tool-boundary"><b>工具边界：</b>只检索：${scene().scope.map(key => names[key]).join('、')}</div><div class="search-row"><input value="钱伟长" aria-label="检索词" readonly><button class="btn primary">检索资料</button></div><div class="results">${item('钱伟长：科学救国与教育思想','knowledge','结构化知识条目',found,isAt(2))}${item('从“两弹一星”看科学家精神','case','平台案例，可在正文引用',found,isAt(3))}${item('钱伟长教学影像与手稿','material','图片与扫描件，可加入附件',found,isAt(4))}${item('钱伟长档案公开线索','web','只提供检索线索，不自动附加',found,isAt(6))}</div>`; }
    function webContent() { const allowed = isAt(1), pasted = isAt(3), sent = isAt(4); return `<div class="tool-boundary"><b>工具边界：</b>${allowed ? '网页采集已在本次范围内' : '未勾选网页采集，URL 不可提交'}</div><div class="web-box"><p class="web-title">网页采集</p><div class="url-row"><input value="${pasted ? 'https://archives.example.edu.cn/qian-weichang' : ''}" placeholder="粘贴网页 URL" ${allowed ? '' : 'disabled'} readonly><button class="btn ${sent ? 'primary' : ''}" ${allowed ? '' : 'disabled'}>提交采集</button></div></div><div class="results" style="margin-top:12px">${item('钱伟长档案网页','web',sent ? '已固定为可追溯网页副本' : '等待提交 URL',sent,isAt(5))}</div>`; }
    function materialContent() { const filtered = isAt(3), selected = isAt(4), mounted = isAt(5); return `<div class="material-box"><p class="web-title">素材掌控台 / 筛选</p><div class="filter-row"><span class="filter ${isAt(1) ? 'active' : ''}">馆藏与高校</span><span class="filter ${isAt(2) ? 'active' : ''}">图片与扫描件</span><span class="filter">可对外使用</span></div><div class="asset-grid"><div class="asset ${filtered ? '' : 'off'} ${selected ? 'focus' : ''}"><i class="file">JPG</i><div><b>钱伟长教学影像与手稿</b><span>${mounted ? '已挂载到当前案例' : filtered ? '上海大学档案馆 · 图片与扫描件' : '等待筛选条件'}</span></div></div><div class="asset off"><i class="file">PDF</i><div><b>钱伟长学术年表</b><span>不符合当前素材类型</span></div></div></div></div><div class="tool-boundary"><b>当前案例：</b>钱伟长专题案例 ${mounted ? '· 已挂载素材附件' : '· 等待挂载'}</div>`; }
    function content() { if (state.current === 6) return searchContent(); if (state.current === 7) return webContent(); if (state.current === 8) return materialContent(); const list = activeScopes(); return `<div class="tool-boundary"><b>范围回传：</b>${list.length ? `资料工具仅能读取：${list.map(key => names[key]).join('、')}` : '未授权来源，资料工具不返回结果'}</div><div class="results">${item('理论知识','knowledge','将供 AI 检索',list.includes('knowledge'),isAt(1))}${item('平台案例与素材','case','案例引用，素材附加',list.includes('platform'),isAt(2))}${item('联网检索','web','公开资料线索',list.includes('online'),isAt(3))}${item('网页采集','web','提交 URL 后生成附件副本',list.includes('web'),list.includes('web'))}</div>`; }
    function sink(title, entries, empty) { const body = entries.length ? entries.map(entry => `<div class="item"><i class="stripe ${entry[1]}"></i><div><b>${entry[0]}</b><span>${entry[2]}</span></div></div>`).join('') : `<span class="empty">${empty}</span>`; return `<section class="sink"><div class="sink-head">${title}<span class="count">${entries.length}</span></div><div class="sink-body">${body}</div></section>`; }
    function destinations() { const list = activeScopes(), scopeScene = state.current === 5; const context = scopeScene && list.includes('knowledge') ? [['理论知识','', '已授权，检索后进入 AI 上下文']] : state.current === 6 && isAt(2) ? [['钱伟长：科学救国与教育思想','', '仅作 AI 检索上下文']] : []; const citations = scopeScene && list.includes('platform') ? [['平台案例','case','已授权，仅可作为正文引用']] : state.current === 6 && isAt(3) ? [['从“两弹一星”看科学家精神','case','正文引用，不进入附件']] : []; const attachments = []; if (scopeScene && list.includes('platform')) attachments.push(['平台素材','material','已授权，检索后可加入附件']); if (scopeScene && list.includes('web')) attachments.push(['网页采集副本','web','授权后提交 URL 进入附件']); if (state.current === 6 && isAt(4)) attachments.push(['钱伟长教学影像与手稿','material','平台素材']); if (state.current === 7 && isAt(6)) attachments.push(['网页副本：钱伟长档案','web','网页采集副本']); if (state.current === 8 && isAt(6)) attachments.push(['钱伟长教学影像与手稿','material','已挂载的素材附件']); return `${sink('AI 检索上下文',context,'理论知识将在这里供 AI 使用')}${sink('正文引用',citations,'平台案例将在这里成为引用')}${sink('附件',attachments,'素材与网页副本将在这里出现')}`; }
    function guardText() { const list = activeScopes(); if (state.current !== 5) return '<b>边界：</b>平台案例只进入正文引用，不能混入附件。'; if (!list.includes('platform')) return '<b>边界：</b>未授权平台案例与素材，正文引用和附件均不接收平台资料。'; if (list.includes('web')) return '<b>边界：</b>平台案例只进入正文引用；网页副本与平台素材才可进入附件。'; return '<b>边界：</b>平台案例已授权，但仍只进入正文引用，不能混入附件。'; }
    function renderTabs() { el('scenes').innerHTML = Object.entries(scenes).map(([id, value]) => `<button class="scene-tab ${Number(id) === state.current ? 'active' : ''}" data-scene="${id}"><span class="scene-num">场景 ${id} · ${value.duration} 秒</span><span class="scene-name">${value.name}</span></button>`).join(''); }
    function render() { const total = scene().steps.length - 1; el('sidebar').innerHTML = scopePane(); el('scene-kicker').textContent = `场景 ${state.current} / ${scene().duration} 秒`; el('scene-title').textContent = scene().name; el('run-state').textContent = state.playing ? '自动演示中' : stage() === total ? '场景完成' : '可手动推进'; el('timeline').style.gridTemplateColumns = `repeat(${total}, 1fr)`; el('timeline').innerHTML = scene().steps.slice(1).map((_, index) => `<i class="tick ${index < stage() ? 'active' : ''}"></i>`).join(''); el('feedback').innerHTML = `<b>步骤 ${stage() + 1}/${total + 1}。</b>${text()}`; el('content').innerHTML = content(); el('destinations').innerHTML = destinations(); el('guard').innerHTML = guardText(); el('time').textContent = `${time(at())} / ${time(scene().duration)}`; el('play').disabled = state.playing || stage() === total; el('pause').disabled = !state.playing; el('next').disabled = stage() === total; renderTabs(); bindTabs(); bindScopes(); }
    function bindTabs() { document.querySelectorAll('[data-scene]').forEach(button => button.addEventListener('click', () => select(Number(button.dataset.scene)))); }
    function bindScopes() { document.querySelectorAll('[data-scope]').forEach(input => input.addEventListener('change', () => { state.scopeOverride = [...document.querySelectorAll('[data-scope]:checked')].map(box => box.dataset.scope); render(); })); }
    function select(id) { clearTimeout(timer); timer = null; state.playing = false; state.current = id; history.replaceState(null, '', `?scene=${scenes[id].key}`); render(); }
    function advance() { const total = scene().steps.length - 1; if (stage() < total) state.stages[state.current] += 1; render(); }
    function schedule() { const next = scene().steps[stage() + 1]; if (!next) return stop(); timer = setTimeout(() => { advance(); state.playing ? schedule() : null; }, (next[0] - at()) * 1000); }
    function play() { if (stage() === scene().steps.length - 1) return; state.playing = true; render(); schedule(); }
    function stop() { clearTimeout(timer); timer = null; state.playing = false; render(); }
    function replay() { clearTimeout(timer); state.stages[state.current] = 0; if (state.current === 5) state.scopeOverride = null; state.playing = true; render(); schedule(); }
    el('play').addEventListener('click', play); el('pause').addEventListener('click', stop); el('replay').addEventListener('click', replay); el('next').addEventListener('click', advance); render();
  </script>
</body>
</html>
